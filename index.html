<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Configurateur</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1> SDP-CP V2 _ Configurateur </h1>

    <!------------------------------- Onglets -------------------------------------------------------->
    <div class="tabs">
        <button class="tab-button active" onclick="openTab('mesures', event)">Mesures</button>
        <button class="tab-button" onclick="openTab('commandes', event)">Commandes</button>
        <button class="tab-button" onclick="openTab('offset', event)">Offset</button>
        <button class="tab-button" onclick="openTab('configuration', event)">Configuration</button>
        <button class="tab-button" onclick="openTab('xport', event)">XPORT</button>
        <button class="tab-button" onclick="openTab('horodatage', event)">Horodatage</button>
        <button class="tab-button" onclick="openTab('debug', event)">Debug</button>
    </div>

    <!--------------------------------- Contenu des onglets ------------------------------------------>
    <div class="tab-content" id="mesures">

        <button type="button" class="collapsible">Mesure 1</button>
        <div class="card">
            <p>I eff: <span id="I_eff">--</span> A </p>
            <p>I crête : <span id="I_crete">--</span> A </p>
            <p>I moy: <span id="I_moy">--</span> A </p>
            <p>U min : <span id="U_min">--</span> mV </p>
            <p>u max: <span id="U_max">--</span> mV </p>

        </div>

          
          

    </div>

    <div class="tab-content" id="commandes" style="display:none;">
        <button onclick="toggleLED()">Allumer/Éteindre LED</button>
        <p>État LED : <span id="ledState">OFF</span></p>
    </div>

    <div class="tab-content" id="offset" style="display:none;">


        <div id="mesuresForm"> </div>

        <button onclick="submitOffsets()">Envoyer</button>

           
    </div>

    <div class="tab-content" id="configuration" style="display:none;">
        <p>Paramètres de configuration</p>
        <!-- Ajoute tes champs ici -->
    </div>

    <div class="tab-content" id="xport" style="display:none;">
        <p>Export des données</p>
    </div>
    <div class="tab-content" id="horodatage" style="display:none;">
        <p>Horodatage actuel : <span id="timestamp">--</span></p>
    </div>

    <div class="tab-content" id="debug" style="display:none;">
        <p>Messages de debug :</p>
        <p class="info"><span class="icon">🌡️</span> Température : <span id="temp">--</span> °C</p>
        <p class="info"><span class="icon">💧</span> Humidité : <span id="hum">--</span> %</p> 

        <pre id="debugMessages"></pre>


    </div>

    <!-- JS -->
    <script src="js/script.js"></script>
</body>
</html>
